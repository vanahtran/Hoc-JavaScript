<script>
    function fibonacci(n){
        if (n <= 1) return n;
        let x = 0;
        let y = 1;
        for (let i = 2; i <= n; i++ ){
            let next = x + y;
            x = y;
            y = next;
        
        }
        return y;
    }
console.log(fibonacci(9));
</script>
